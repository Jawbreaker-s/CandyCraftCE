name: build
on:
  push:
    paths-ignore:
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        loader: [ fabric, forge ]
      fail-fast: false
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew ${{ matrix.loader }}:build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.loader }}
          path: |
            ${{ matrix.loader }}/build/*.jar 
            ${{ matrix.loader }}/build/libs/*.jar

      - name: Upload-slim
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.loader }}-slim
          path: |
            ${{ matrix.loader }}/build/*.jar
            ${{ matrix.loader }}/build/libs/*.jar
            !${{ matrix.loader }}/build/libs/*-shadow.jar
            !${{ matrix.loader }}/build/libs/*-sources.jar
            !${{ matrix.loader }}/build/libs/*-javadoc.jar